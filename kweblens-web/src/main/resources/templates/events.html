<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Events</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <section class="flex-grow-1 min-width-0">
            <div class="d-flex align-items-center mb-3">
                <h1 class="h5 mb-0">Events</h1>
                <span class="badge text-bg-secondary ms-2" th:text="${#lists.size(events)} + ' items'">0 items</span>
                <form class="ms-auto" method="get">
                    <input class="form-control form-control-sm" type="search" name="namespace"
                           placeholder="filter namespace…" th:value="${namespace}"/>
                </form>
            </div>

            <table class="table table-sm table-hover bg-body shadow-sm rounded align-middle">
                <thead>
                <tr>
                    <th>Type</th>
                    <th>Reason</th>
                    <th>Object</th>
                    <th>Namespace</th>
                    <th>Message</th>
                    <th>Age</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${events}">
                    <td>
                        <span class="badge"
                              th:classappend="${e.type() == 'Warning'} ? 'text-bg-warning' : 'text-bg-light border'"
                              th:text="${e.type()} ?: '—'">Normal</span>
                    </td>
                    <td th:text="${e.reason()} ?: '—'">Reason</td>
                    <td class="text-break" th:text="${e.object()}">Kind/name</td>
                    <td th:text="${e.namespace()} ?: '—'">ns</td>
                    <td class="text-break small" th:text="${e.message()}">message</td>
                    <td th:text="${e.age()}">age</td>
                </tr>
                <tr th:if="${#lists.isEmpty(events)}">
                    <td colspan="6" class="text-muted">No events.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</div>
</body>
</html>
