<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${descriptor.label()}">Resources</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <!-- Left category nav (driven entirely by NavCatalog) -->
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <!-- Main: the reusable resource list -->
        <section class="flex-grow-1 min-width-0">
            <div class="d-flex align-items-center mb-3">
                <h1 class="h5 mb-0" th:text="${descriptor.label()}">Kind</h1>
                <span id="item-count" class="badge text-bg-secondary ms-2"
                      th:text="${#lists.size(rows)} + ' items'">0 items</span>
                <span id="live-status" class="badge text-bg-light border ms-2" title="live updates">
                    <i class="bi bi-broadcast"></i> connecting…
                </span>
                <form class="ms-auto" method="get" th:if="${descriptor.namespaced()}">
                    <input class="form-control form-control-sm" type="search" name="namespace"
                           placeholder="filter namespace…" th:value="${namespace}"/>
                </form>
            </div>

            <table id="rtable" class="table table-sm table-hover bg-body shadow-sm rounded align-middle"
                   th:data-cluster="${clusterId}" th:data-resource="${selectedId}" th:data-kind="${descriptor.kind()}"
                   th:data-namespaced="${descriptor.namespaced()}" th:data-namespace="${namespace}">
                <thead>
                <tr>
                    <th th:if="${descriptor.namespaced()}">Namespace</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Age</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rows}" th:attr="data-key=(${r.namespace()} ?: '') + '/' + ${r.name()}">
                    <td th:if="${descriptor.namespaced()}" th:text="${r.namespace()} ?: '—'">default</td>
                    <td class="text-break">
                        <a class="text-decoration-none"
                           th:href="@{/clusters/{c}/detail(c=${clusterId},resource=${selectedId},namespace=${r.namespace()},name=${r.name()})}"
                           th:text="${r.name()}">name</a>
                    </td>
                    <td>
                        <span th:if="${r.status()}" class="badge text-bg-light border" th:text="${r.status()}">Status</span>
                        <span th:unless="${r.status()}" class="text-muted">—</span>
                    </td>
                    <td th:text="${r.age()}">age</td>
                    <td class="text-end text-nowrap">
                        <a th:if="${descriptor.kind() == 'Pod'}" class="btn btn-sm btn-outline-secondary py-0"
                           th:href="@{/clusters/{c}/pods/{ns}/{p}/logs(c=${clusterId},ns=${r.namespace()},p=${r.name()})}">
                            <i class="bi bi-terminal"></i> logs
                        </a>
                        <a th:if="${descriptor.kind() == 'Pod'}" class="btn btn-sm btn-outline-secondary py-0"
                           th:href="@{/clusters/{c}/pods/{ns}/{p}/exec(c=${clusterId},ns=${r.namespace()},p=${r.name()})}">
                            <i class="bi bi-terminal-fill"></i> exec
                        </a>
                        <a class="btn btn-sm btn-outline-secondary py-0"
                           th:href="@{/clusters/{c}/yaml(c=${clusterId},resource=${selectedId},namespace=${r.namespace()},name=${r.name()})}">
                            <i class="bi bi-file-earmark-code"></i> yaml
                        </a>
                    </td>
                </tr>
                <tr id="empty-row" th:if="${#lists.isEmpty(rows)}">
                    <td th:attr="colspan=${descriptor.namespaced()} ? 5 : 4" class="text-muted">No resources.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script th:inline="none">
        (function () {
            const table = document.getElementById('rtable');
            const tbody = table.tBodies[0];
            const status = document.getElementById('live-status');
            const countEl = document.getElementById('item-count');
            const d = table.dataset;
            const namespaced = d.namespaced === 'true';
            const isPod = d.kind === 'Pod';
            const base = '/clusters/' + encodeURIComponent(d.cluster);

            function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
            function q(o) { return Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&'); }
            function keyOf(r) { return (r.namespace || '') + '/' + r.name; }

            function cells(r) {
                const ns = r.namespace || '';
                let html = '';
                if (namespaced) { html += '<td>' + esc(r.namespace || '—') + '</td>'; }
                html += '<td class="text-break"><a class="text-decoration-none" href="' + base + '/detail?' +
                    q({resource: d.resource, namespace: ns, name: r.name}) + '">' + esc(r.name) + '</a></td>';
                html += '<td>' + (r.status
                    ? '<span class="badge text-bg-light border">' + esc(r.status) + '</span>'
                    : '<span class="text-muted">—</span>') + '</td>';
                html += '<td>' + esc(r.age) + '</td>';
                let actions = '';
                if (isPod) {
                    actions += '<a class="btn btn-sm btn-outline-secondary py-0" href="' + base + '/pods/' +
                        encodeURIComponent(ns) + '/' + encodeURIComponent(r.name) + '/logs"><i class="bi bi-terminal"></i> logs</a> ';
                    actions += '<a class="btn btn-sm btn-outline-secondary py-0" href="' + base + '/pods/' +
                        encodeURIComponent(ns) + '/' + encodeURIComponent(r.name) + '/exec"><i class="bi bi-terminal-fill"></i> exec</a> ';
                }
                actions += '<a class="btn btn-sm btn-outline-secondary py-0" href="' + base + '/yaml?' +
                    q({resource: d.resource, namespace: ns, name: r.name}) + '"><i class="bi bi-file-earmark-code"></i> yaml</a>';
                html += '<td class="text-end text-nowrap">' + actions + '</td>';
                return html;
            }

            function recount() { countEl.textContent = tbody.querySelectorAll('tr[data-key]').length + ' items'; }

            function upsert(r) {
                const empty = document.getElementById('empty-row');
                if (empty) { empty.remove(); }
                let tr = tbody.querySelector('tr[data-key="' + CSS.escape(keyOf(r)) + '"]');
                if (!tr) { tr = document.createElement('tr'); tr.setAttribute('data-key', keyOf(r)); tbody.appendChild(tr); }
                tr.innerHTML = cells(r);
                tr.classList.add('table-active');
                setTimeout(() => tr.classList.remove('table-active'), 900);
                recount();
            }

            function remove(r) {
                const tr = tbody.querySelector('tr[data-key="' + CSS.escape(keyOf(r)) + '"]');
                if (tr) { tr.remove(); }
                recount();
            }

            const ns = d.namespace ? ('?namespace=' + encodeURIComponent(d.namespace)) : '';
            const es = new EventSource('/api/v1/clusters/' + encodeURIComponent(d.cluster) +
                '/resources/' + encodeURIComponent(d.resource) + '/watch' + ns);
            es.onopen = () => { status.className = 'badge text-bg-success ms-2'; status.innerHTML = '<i class="bi bi-broadcast"></i> live'; };
            es.addEventListener('ADDED', e => upsert(JSON.parse(e.data)));
            es.addEventListener('MODIFIED', e => upsert(JSON.parse(e.data)));
            es.addEventListener('DELETED', e => remove(JSON.parse(e.data)));
            es.onerror = () => { status.className = 'badge text-bg-secondary ms-2'; status.innerHTML = '<i class="bi bi-broadcast"></i> reconnecting…'; };
            window.addEventListener('beforeunload', () => es.close());
        })();
    </script>
</div>
</body>
</html>
