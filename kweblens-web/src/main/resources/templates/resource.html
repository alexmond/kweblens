<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${descriptor.label()}">Resources</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <!-- Left category nav (driven entirely by NavCatalog) -->
        <aside class="kw-nav border-end pe-3 me-3 flex-shrink-0" style="width: 15rem;">
            <a th:href="@{/}" class="small text-decoration-none">&larr; Clusters</a>
            <div class="fw-semibold mt-2 mb-3 text-truncate"
                 th:text="${cluster != null ? cluster.name() : clusterId}">cluster</div>

            <div th:each="cat : ${categories}" class="mb-3">
                <div class="text-uppercase text-muted small mb-1">
                    <i class="bi" th:classappend="${cat.icon()}"></i>
                    <span th:text="${cat.label()}">Category</span>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item" th:each="item : ${cat.items()}">
                        <a class="nav-link py-1 px-2 small"
                           th:classappend="${item.id() == selectedId} ? 'active fw-semibold' : 'link-body-emphasis'"
                           th:href="@{/clusters/{c}/r/{id}(c=${clusterId},id=${item.id()})}"
                           th:text="${item.label()}">Kind</a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Main: the reusable resource list -->
        <section class="flex-grow-1 min-width-0">
            <div class="d-flex align-items-center mb-3">
                <h1 class="h5 mb-0" th:text="${descriptor.label()}">Kind</h1>
                <span class="badge text-bg-secondary ms-2" th:text="${#lists.size(rows)} + ' items'">0 items</span>
                <form class="ms-auto" method="get" th:if="${descriptor.namespaced()}">
                    <input class="form-control form-control-sm" type="search" name="namespace"
                           placeholder="filter namespace…" th:value="${namespace}"/>
                </form>
            </div>

            <table class="table table-sm table-hover bg-body shadow-sm rounded align-middle">
                <thead>
                <tr>
                    <th th:if="${descriptor.namespaced()}">Namespace</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Age</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td th:if="${descriptor.namespaced()}" th:text="${r.namespace()} ?: '—'">default</td>
                    <td class="text-break" th:text="${r.name()}">name</td>
                    <td>
                        <span th:if="${r.status()}" class="badge text-bg-light border" th:text="${r.status()}">Status</span>
                        <span th:unless="${r.status()}" class="text-muted">—</span>
                    </td>
                    <td th:text="${r.age()}">age</td>
                </tr>
                <tr th:if="${#lists.isEmpty(rows)}">
                    <td th:attr="colspan=${descriptor.namespaced()} ? 4 : 3" class="text-muted">No resources.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</div>
</body>
</html>
