<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Metrics</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <section class="flex-grow-1 min-width-0">
            <h1 class="h5 mb-3"><i class="bi bi-speedometer2"></i> Metrics</h1>

            <div th:if="${#lists.isEmpty(nodeUsage) and #lists.isEmpty(podUsage)}" class="alert alert-info">
                No usage data. metrics-server may not be installed in this cluster.
            </div>

            <h2 class="h6 text-muted">Nodes</h2>
            <table class="table table-sm table-hover bg-body shadow-sm rounded mb-4">
                <thead>
                <tr>
                    <th>Node</th>
                    <th>CPU</th>
                    <th>Memory</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${nodeUsage}">
                    <td th:text="${u.name()}">node</td>
                    <td th:text="${u.cpu()}">cpu</td>
                    <td th:text="${u.memory()}">mem</td>
                </tr>
                <tr th:if="${#lists.isEmpty(nodeUsage)}">
                    <td colspan="3" class="text-muted">No node metrics.</td>
                </tr>
                </tbody>
            </table>

            <div class="d-flex align-items-center mb-2">
                <h2 class="h6 text-muted mb-0">Pods</h2>
                <form class="ms-auto" method="get">
                    <input class="form-control form-control-sm" type="search" name="namespace"
                           placeholder="filter namespace…" th:value="${namespace}"/>
                </form>
            </div>
            <table class="table table-sm table-hover bg-body shadow-sm rounded">
                <thead>
                <tr>
                    <th>Namespace</th>
                    <th>Pod</th>
                    <th>CPU</th>
                    <th>Memory</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${podUsage}">
                    <td th:text="${u.namespace()} ?: '—'">ns</td>
                    <td th:text="${u.name()}">pod</td>
                    <td th:text="${u.cpu()}">cpu</td>
                    <td th:text="${u.memory()}">mem</td>
                </tr>
                <tr th:if="${#lists.isEmpty(podUsage)}">
                    <td colspan="4" class="text-muted">No pod metrics.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
</div>
</body>
</html>
