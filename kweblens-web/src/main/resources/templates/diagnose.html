<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Diagnose</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <section class="flex-grow-1 min-width-0">
            <div class="d-flex align-items-center mb-3">
                <h1 class="h5 mb-0"><i class="bi bi-heart-pulse"></i> Diagnosis</h1>
                <span class="badge text-bg-secondary ms-2"
                      th:text="${#lists.size(diagnosis.findings())} + ' findings'">0 findings</span>
                <span class="badge text-bg-info ms-2" th:if="${diagnosis.aiEnriched()}">AI</span>
                <form class="ms-auto" method="get">
                    <input class="form-control form-control-sm" type="search" name="namespace"
                           placeholder="filter namespace…" th:value="${namespace}"/>
                </form>
            </div>

            <div class="alert alert-info" th:if="${diagnosis.summary() != null}">
                <strong>Summary.</strong> <span th:text="${diagnosis.summary()}">…</span>
            </div>

            <div th:if="${#lists.isEmpty(diagnosis.findings())}" class="alert alert-success">
                No problems detected by the validators.
            </div>

            <div class="card mb-2" th:each="f : ${diagnosis.findings()}">
                <div class="card-body py-2">
                    <div class="d-flex align-items-center">
                        <span class="badge"
                              th:classappend="${f.severity() == 'critical'} ? 'text-bg-danger'
                                             : (${f.severity() == 'warning'} ? 'text-bg-warning' : 'text-bg-secondary')"
                              th:text="${f.severity()}">severity</span>
                        <strong class="ms-2" th:text="${f.title()}">title</strong>
                        <code class="ms-2 small" th:text="${f.object()}">Kind/ns/name</code>
                        <span class="ms-auto badge text-bg-light border" th:text="${f.source()}">validator</span>
                    </div>
                    <div class="small text-muted mt-1" th:if="${f.detail()}" th:text="${f.detail()}">detail</div>
                    <div class="small mt-1" th:if="${f.suggestedFix()}">
                        <i class="bi bi-arrow-right-short"></i> <span th:text="${f.suggestedFix()}">fix</span>
                    </div>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(proposals)}" class="mt-4">
                <h2 class="h6 text-muted">Proposed remediations</h2>
                <p class="small text-muted">Nothing is applied until you approve. Applying requires sign-in.</p>
                <div class="card mb-2 border-primary-subtle" th:each="p : ${proposals}">
                    <div class="card-body py-2">
                        <div class="d-flex align-items-center">
                            <span class="badge text-bg-primary" th:text="${p.action()}">action</span>
                            <code class="ms-2 small" th:text="${p.namespace()} + '/' + ${p.target()}">ns/target</code>
                            <span class="ms-2 badge text-bg-light border" th:text="'risk: ' + ${p.risk()}">risk</span>
                            <form class="ms-auto" method="post" th:action="@{/clusters/{c}/remediate(c=${clusterId})}"
                                  onsubmit="return confirm('Apply this remediation?');">
                                <input type="hidden" name="action" th:value="${p.action()}"/>
                                <input type="hidden" name="namespace" th:value="${p.namespace()}"/>
                                <input type="hidden" name="target" th:value="${p.target()}"/>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Approve &amp; apply</button>
                            </form>
                        </div>
                        <div class="small mt-1" th:text="${p.description()}">description</div>
                        <div class="small text-muted font-monospace mt-1" th:text="${p.preview()}">dry-run</div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
