<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:attr="data-skin=${skin != null ? skin : 'vcenter'}, data-bs-theme=${skinTheme != null ? skinTheme : 'light'}"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE · kweblens">kweblens</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/webjars/htmx.org/2.0.4/dist/htmx.min.js}" defer></script>
</head>
<body class="bg-body-tertiary">
<nav class="navbar kw-navbar">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <i class="bi bi-hexagon-fill"></i> kweblens
        </a>
        <span class="navbar-text small kw-navbar-sub me-auto">web Kubernetes IDE</span>

        <!-- Skin picker: JS-free disclosure dropdown -->
        <details class="kw-skinpicker me-3">
            <summary>
                <i class="bi bi-palette"></i>
                <span th:text="${skinLabel != null ? skinLabel : 'vCenter'}">vCenter</span>
                <i class="bi bi-chevron-down small"></i>
            </summary>
            <ul>
                <li th:each="s : ${skins}">
                    <a th:href="@{/skin/{id}(id=${s.id()},returnTo=${currentUri})}"
                       th:classappend="${s.id() == skin} ? 'active' : ''">
                        <i class="bi bi-check2" th:style="${s.id() == skin} ? '' : 'visibility:hidden'"></i>
                        <span th:text="${s.label()}">Skin</span>
                    </a>
                </li>
            </ul>
        </details>

        <a class="nav-link small kw-navbar-link" th:href="@{/audit}">
            <i class="bi bi-clipboard-check"></i> Audit
        </a>
    </div>
</nav>
<main class="container-fluid py-4">
    <div layout:fragment="content">
        <p>Content goes here.</p>
    </div>
</main>
</body>
</html>
