<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Audit</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex align-items-center mb-3">
        <h1 class="h5 mb-0"><i class="bi bi-clipboard-check"></i> Audit trail</h1>
        <span class="badge text-bg-secondary ms-2" th:text="${#lists.size(entries)} + ' entries'">0 entries</span>
    </div>

    <p class="text-muted small">Mutating actions this server has performed (newest first, in-memory).</p>

    <table class="table table-sm table-hover bg-body shadow-sm rounded align-middle">
        <thead>
        <tr>
            <th>Time</th>
            <th>User</th>
            <th>Cluster</th>
            <th>Action</th>
            <th>Target</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${entries}">
            <td class="small text-nowrap" th:text="${e.timestamp()}">time</td>
            <td th:text="${e.user()}">user</td>
            <td><code th:text="${e.cluster()}">cluster</code></td>
            <td><span class="badge text-bg-light border" th:text="${e.action()}">action</span></td>
            <td class="text-break small" th:text="${e.target()}">target</td>
        </tr>
        <tr th:if="${#lists.isEmpty(entries)}">
            <td colspan="5" class="text-muted">No actions recorded yet.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
