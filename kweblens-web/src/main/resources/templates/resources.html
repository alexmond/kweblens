<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="${kind}">Resources</title>
</head>
<body>
<div layout:fragment="content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Clusters</a></li>
            <li class="breadcrumb-item active"><code th:text="${clusterId}">default</code></li>
            <li class="breadcrumb-item active" th:text="${kind}">Pods</li>
        </ol>
    </nav>

    <table class="table table-sm table-hover bg-body shadow-sm rounded">
        <thead>
        <tr>
            <th>Namespace</th>
            <th>Name</th>
            <th>Status</th>
            <th>Age</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}">
            <td th:text="${r.namespace()} ?: '—'">default</td>
            <td th:text="${r.name()}">nginx</td>
            <td th:text="${r.status()} ?: '—'">Running</td>
            <td th:text="${r.age()}">3d</td>
        </tr>
        <tr th:if="${#lists.isEmpty(rows)}">
            <td colspan="4" class="text-muted">No resources.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
