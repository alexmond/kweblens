<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="'YAML · ' + ${name}">YAML</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <section class="flex-grow-1 min-width-0">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/clusters/{c}/r/{id}(c=${clusterId},id=${resource})}"
                           th:text="${descriptor.label()}">Kind</a>
                    </li>
                    <li class="breadcrumb-item active" th:if="${namespace}" th:text="${namespace}">ns</li>
                    <li class="breadcrumb-item active" th:text="${name}">name</li>
                </ol>
            </nav>

            <div th:if="${yaml == null}" class="alert alert-warning">Resource not found.</div>

            <form th:if="${yaml != null}" method="post" th:action="@{/clusters/{c}/apply(c=${clusterId})}">
                <input type="hidden" name="resource" th:value="${resource}"/>
                <input type="hidden" name="namespace" th:value="${namespace}"/>
                <textarea class="form-control font-monospace small" name="manifest" rows="24"
                          spellcheck="false" th:text="${yaml}"></textarea>
                <div class="d-flex mt-2">
                    <span class="text-muted small">Server-side apply. Requires authentication.</span>
                    <button type="submit" class="btn btn-sm btn-primary ms-auto">
                        <i class="bi bi-check2"></i> Apply
                    </button>
                </div>
            </form>
        </section>
    </div>
</div>
</body>
</html>
