<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title>Clusters</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="h4 mb-3">Clusters</h1>

    <div th:if="${#lists.isEmpty(clusters)}" class="alert alert-info">
        No clusters connected. kweblens seeds the ambient kubeconfig as <code>default</code> on
        startup — set <code>KWEBLENS_LOAD_KUBECONFIG=true</code> and mount a kubeconfig.
    </div>

    <table th:unless="${#lists.isEmpty(clusters)}" class="table table-hover bg-body shadow-sm rounded">
        <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>API server</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clusters}">
            <td><code th:text="${c.id()}">default</code></td>
            <td th:text="${c.name()}">Current kubeconfig</td>
            <td class="text-truncate" style="max-width: 22rem;" th:text="${c.masterUrl()}">https://…</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/clusters/{id}(id=${c.id()})}">Open</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
