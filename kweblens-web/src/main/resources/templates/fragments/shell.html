<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  Reusable in-cluster shell: a cluster-switcher rail + the left category nav. Expects the model to
  carry: allClusters, categories, clusterId, cluster, selectedId. Included by every in-cluster page.
-->
<div th:fragment="sidebar" class="d-flex flex-shrink-0">
    <!-- Cluster rail: one tile per connected cluster (Freelens-style switcher) -->
    <div class="kw-rail d-flex flex-column align-items-center pe-2 me-2 border-end">
        <a th:href="@{/}" class="kw-rail-tile kw-rail-home mb-2" title="All clusters">
            <i class="bi bi-grid-3x3-gap-fill"></i>
        </a>
        <a th:each="c : ${allClusters}" th:href="@{/clusters/{id}(id=${c.id()})}"
           class="kw-rail-tile mb-2 text-decoration-none"
           th:classappend="${c.id() == clusterId} ? 'active' : ''"
           th:title="${c.name()}"
           th:text="${#strings.toUpperCase(c.id().length() >= 2 ? c.id().substring(0,2) : c.id())}">DE</a>
    </div>

    <!-- Category nav -->
    <aside class="kw-nav pe-3 me-1" style="width: 14rem;">
    <a th:href="@{/}" class="small text-decoration-none">&larr; Clusters</a>
    <div class="fw-semibold mt-2 text-truncate"
         th:text="${cluster != null ? cluster.name() : clusterId}">cluster</div>
    <a class="nav-link py-1 px-2 small"
       th:classappend="${selectedId == 'metrics'} ? 'active fw-semibold' : 'link-body-emphasis'"
       th:href="@{/clusters/{c}/metrics(c=${clusterId})}">
        <i class="bi bi-speedometer2"></i> Metrics
    </a>
    <a class="nav-link py-1 px-2 small"
       th:classappend="${selectedId == 'helm'} ? 'active fw-semibold' : 'link-body-emphasis'"
       th:href="@{/clusters/{c}/helm(c=${clusterId})}">
        <i class="bi bi-hexagon"></i> Helm
    </a>
    <a class="nav-link py-1 px-2 small mb-2"
       th:classappend="${selectedId == 'diagnose'} ? 'active fw-semibold' : 'link-body-emphasis'"
       th:href="@{/clusters/{c}/diagnose(c=${clusterId})}">
        <i class="bi bi-heart-pulse"></i> Diagnose
    </a>

    <div th:each="cat : ${categories}" class="mb-3">
        <div class="text-uppercase text-muted small mb-1">
            <i class="bi" th:classappend="${cat.icon()}"></i>
            <span th:text="${cat.label()}">Category</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item" th:each="item : ${cat.items()}">
                <a class="nav-link py-1 px-2 small"
                   th:classappend="${item.id() == selectedId} ? 'active fw-semibold' : 'link-body-emphasis'"
                   th:href="${item.id() == 'events'}
                            ? @{/clusters/{c}/events(c=${clusterId})}
                            : @{/clusters/{c}/r/{id}(c=${clusterId},id=${item.id()})}"
                   th:text="${item.label()}">Kind</a>
            </li>
        </ul>
    </div>
    </aside>
</div>
</body>
</html>
