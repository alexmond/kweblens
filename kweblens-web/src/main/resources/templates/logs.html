<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="en">
<head>
    <title th:text="'Logs · ' + ${pod}">Logs</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex">
        <div th:replace="~{fragments/shell :: sidebar}"></div>

        <section class="flex-grow-1 min-width-0">
            <div class="d-flex align-items-center mb-2">
                <h1 class="h6 mb-0">
                    <i class="bi bi-terminal"></i>
                    <span th:text="${namespace} + ' / ' + ${pod}">ns / pod</span>
                    <span class="text-muted" th:if="${container}" th:text="'· ' + ${container}"></span>
                </h1>
                <span id="log-status" class="badge text-bg-secondary ms-2">connecting…</span>
            </div>

            <pre id="logbox" class="bg-dark text-light p-3 rounded small"
                 style="height: 65vh; overflow: auto; white-space: pre-wrap;"
                 th:data-stream-url="@{/api/v1/clusters/{c}/pods/{ns}/{p}/log/stream(c=${clusterId},ns=${namespace},p=${pod},container=${container})}"></pre>
        </section>
    </div>

    <script th:inline="none">
        (function () {
            const box = document.getElementById('logbox');
            const status = document.getElementById('log-status');
            const es = new EventSource(box.dataset.streamUrl);
            es.onopen = () => { status.textContent = 'streaming'; status.className = 'badge text-bg-success ms-2'; };
            es.onmessage = (e) => {
                const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
                box.textContent += e.data + '\n';
                if (atBottom) { box.scrollTop = box.scrollHeight; }
            };
            es.onerror = () => { status.textContent = 'disconnected'; status.className = 'badge text-bg-secondary ms-2'; es.close(); };
            window.addEventListener('beforeunload', () => es.close());
        })();
    </script>
</div>
</body>
</html>
