spring:
  application:
    name: kweblens

  # We keep JhelmKubeAutoConfiguration excluded so jhelm builds NO ambient KubeService — kweblens
  # builds one KubeService per cluster inside HelmService for multi-cluster release ops. But
  # JhelmCoreAutoConfiguration IS enabled: without a KubeService bean it registers only the
  # cluster-agnostic beans (RepoManager, ChartLoader, Show/Template/Create/SearchHub actions),
  # which back jhelm-rest's Repo/Chart/Hub controllers (the dogfood). Its release actions are
  # @ConditionalOnBean(KubeService.class) so they never register.
  autoconfigure:
    exclude:
      - org.alexmond.jhelm.core.JhelmMetricsAutoConfiguration
      - org.alexmond.jhelm.kube.JhelmKubeAutoConfiguration

  cloud:
    config:
      # The central config server is OPTIONAL. Don't hard-require spring.config.import so dev/test
      # (and any deploy without a config server) start with the config client inert. Prod injects
      # SPRING_CONFIG_IMPORT=optional:configserver:<url> to pull central config normally.
      import-check:
        enabled: false
    discovery:
      client:
        # spring-cloud-starter-config transitively registers a DiscoveryClientHealthIndicator;
        # kweblens runs no discovery client, so disable it here to keep /actuator/health clean.
        health-indicator:
          enabled: false

  # Grace window for in-flight requests on shutdown (pairs with server.shutdown: graceful).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Bounded, short-TTL cache for hot list/get reads against the API server.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10s

  # In-jar MCP server (SSE over WebMVC) exposing read-only cluster tools.
  ai:
    # Placeholder key so the Anthropic ChatClient bean constructs; it is never called unless
    # kweblens.ai.enabled=true. Set a real key (ANTHROPIC_API_KEY) to turn on AI enrichment.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
    mcp:
      server:
        name: kweblens
        version: 0.1.0
        type: SYNC

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

# kweblens cluster discovery — see org.alexmond.kweblens.config.KweblensProperties
kweblens:
  load-kubeconfig: ${KWEBLENS_LOAD_KUBECONFIG:true}
  clusters: []
  # AI diagnosis (#10). Deterministic validators always run; LLM enrichment only when enabled
  # AND an Anthropic API key is configured.
  ai:
    enabled: ${KWEBLENS_AI_ENABLED:false}
  # Helm chart repositories seeded on startup into the shared jhelm RepoManager (idempotent).
  # After boot, repos are managed at runtime via jhelm-rest (/api/v1/helm/repos) and persisted
  # to jhelm.core.config-path below.
  helm:
    repositories:
      - name: prometheus-community
        url: https://prometheus-community.github.io/helm-charts
      - name: ingress-nginx
        url: https://kubernetes.github.io/ingress-nginx

# jhelm-rest dogfood: the cluster-agnostic Helm REST surface (repos, chart versions/values,
# Artifact Hub) served under /api/v1/helm/*. See the autoconfigure note above.
jhelm:
  # Persist kweblens's OWN repository list + index cache under a writable data dir — NEVER the
  # operator's ~/.config/helm. In-cluster this is a mounted PVC (KWEBLENS_HELM_HOME=/data/helm);
  # locally it defaults under the user home. (JhelmCoreProperties' prefix is `jhelm`, so these
  # sit directly here, not under jhelm.core.)
  config-path: ${KWEBLENS_HELM_HOME:${user.home}/.kweblens/helm}/repositories.yaml
  repository-cache-path: ${KWEBLENS_HELM_HOME:${user.home}/.kweblens/helm}/cache
  rest:
    # Namespaced under kweblens's API so it doesn't collide with /api/v1/clusters/*.
    base-path: /api/v1/helm
  security:
    # kweblens's own SecurityConfig gates mutating (non-GET) /api/v1/helm/** behind the admin
    # login, and its AccessModeInterceptor is neutralised (see JhelmRestIntegrationConfig), so
    # FULL just means "don't 403 mutating ops at jhelm's layer".
    mode: FULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: full

logging:
  level:
    io.fabric8.kubernetes.client: WARN
