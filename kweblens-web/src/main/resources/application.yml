spring:
  application:
    name: kweblens

  # jhelm.kubernetes.backend=none (below) makes JhelmKubeAutoConfiguration build NO ambient client
  # and NO default KubeService — so we no longer exclude it by class name; kweblens builds one
  # fabric8 KubeService per cluster inside HelmService for multi-cluster release ops. With no
  # KubeService bean, JhelmCoreAutoConfiguration registers only the cluster-agnostic beans
  # (RepoManager, ChartLoader, Show/Template/Create/SearchHub actions) that back jhelm-rest's
  # Repo/Chart/Hub controllers (the dogfood); its release actions are @ConditionalOnBean(KubeService)
  # so they never register.
  autoconfigure:
    exclude:
      - org.alexmond.jhelm.core.JhelmMetricsAutoConfiguration

  cloud:
    config:
      # The central config server is OPTIONAL. Don't hard-require spring.config.import so dev/test
      # (and any deploy without a config server) start with the config client inert. Prod injects
      # SPRING_CONFIG_IMPORT=optional:configserver:<url> to pull central config normally.
      import-check:
        enabled: false
    discovery:
      client:
        # spring-cloud-starter-config transitively registers a DiscoveryClientHealthIndicator;
        # kweblens runs no discovery client, so disable it here to keep /actuator/health clean.
        health-indicator:
          enabled: false

  # Grace window for in-flight requests on shutdown (pairs with server.shutdown: graceful).
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Bounded, short-TTL cache for hot list/get reads against the API server.
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=10s

  # In-jar MCP server (SSE over WebMVC) exposing read-only cluster tools.
  ai:
    # Placeholder key so the Anthropic ChatClient bean constructs; it is never called unless
    # kweblens.ai.enabled=true. Set a real key (ANTHROPIC_API_KEY) to turn on AI enrichment.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
    mcp:
      server:
        name: kweblens
        version: 0.1.0
        type: SYNC

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

# kweblens cluster discovery — see org.alexmond.kweblens.config.KweblensProperties
kweblens:
  load-kubeconfig: ${KWEBLENS_LOAD_KUBECONFIG:true}
  clusters: []
  # Clusters added at runtime through POST /api/v1/clusters. A kubeconfig is a credential, so
  # `auto` keeps it in a Kubernetes Secret when kweblens runs in-cluster (encryption-at-rest +
  # RBAC + survives a reschedule with no PVC) and in the data directory otherwise, which is the
  # only durable option off-cluster. Set mode=memory to refuse to persist credentials at all.
  cluster-store:
    mode: ${KWEBLENS_CLUSTER_STORE_MODE:auto}
    path: ${KWEBLENS_DATA_DIR:${user.home}/.kweblens}/clusters
  # Built-in cluster simulator (dev / CI / performance testing) — generates an in-JVM "sim"
  # cluster with configurable object counts, no real cluster. Enable and pair with
  # KWEBLENS_LOAD_KUBECONFIG=false so the simulator is the only cluster. See web/sim/*.
  simulator:
    enabled: ${KWEBLENS_SIMULATOR_ENABLED:false}
    size: ${KWEBLENS_SIMULATOR_SIZE:200}
    namespaces: ${KWEBLENS_SIMULATOR_NAMESPACES:3}
  # Pod file browser (#140) — browse/view/edit files inside a container over the exec API.
  # OFF by default and deliberately so: it can read a projected Secret volume or the
  # service-account token straight off a container's disk, which no other kweblens view
  # exposes. ADR-001 (kweblens runs as one shared, non-RBAC-aware identity) requires it to
  # stay opt-in. Note that EVERY endpoint here — GETs included — requires the admin login
  # even in open-mode; see SecurityConfig.
  files:
    enabled: ${KWEBLENS_FILES_ENABLED:false}
    # Set false for browse-and-download only (no edit, upload or delete).
    writable: ${KWEBLENS_FILES_WRITABLE:true}
    max-read-bytes: ${KWEBLENS_FILES_MAX_READ_BYTES:1048576}
    max-write-bytes: ${KWEBLENS_FILES_MAX_WRITE_BYTES:1048576}
    max-entries: ${KWEBLENS_FILES_MAX_ENTRIES:1000}
    # Optional confinement, e.g. ["/data","/tmp"]; empty means the whole container filesystem.
    allowed-roots: []
  # AI diagnosis (#10). Deterministic validators always run; LLM enrichment only when enabled
  # AND an Anthropic API key is configured.
  ai:
    enabled: ${KWEBLENS_AI_ENABLED:false}
  # Helm chart repositories seeded on startup into the shared jhelm RepoManager (idempotent).
  # After boot, repos are managed at runtime via jhelm-rest (/api/v1/helm/repos) and persisted
  # to jhelm.core.config-path below.
  helm:
    # Reusable values-file library — persisted under the Helm home (PVC in-cluster).
    values-path: ${KWEBLENS_HELM_HOME:${user.home}/.kweblens/helm}/values
    repositories:
      - name: prometheus-community
        url: https://prometheus-community.github.io/helm-charts
      - name: ingress-nginx
        url: https://kubernetes.github.io/ingress-nginx

# jhelm-rest dogfood: the cluster-agnostic Helm REST surface (repos, chart versions/values,
# Artifact Hub) served under /api/v1/helm/*. See the autoconfigure note above.
jhelm:
  # Persist kweblens's OWN repository list + index cache under a writable data dir — NEVER the
  # operator's ~/.config/helm. In-cluster this is a mounted PVC (KWEBLENS_HELM_HOME=/data/helm);
  # locally it defaults under the user home. (JhelmCoreProperties' prefix is `jhelm`, so these
  # sit directly here, not under jhelm.core.)
  config-path: ${KWEBLENS_HELM_HOME:${user.home}/.kweblens/helm}/repositories.yaml
  repository-cache-path: ${KWEBLENS_HELM_HOME:${user.home}/.kweblens/helm}/cache
  kubernetes:
    # backend=none: jhelm builds no ambient Kubernetes client and no default KubeService (#796).
    # kweblens supplies one fabric8 KubeService per cluster via KubeServices.fabric8(...) in
    # HelmService — reusing the registry's authenticated fabric8 client (in-cluster SA or
    # kubeconfig). No ambient cluster to probe, so the jhelm Kubernetes health indicator is off.
    backend: none
    health:
      enabled: false
  rest:
    # Namespaced under kweblens's API so it doesn't collide with /api/v1/clusters/*.
    base-path: /api/v1/helm
  security:
    # kweblens's own SecurityConfig gates mutating (non-GET) /api/v1/helm/** behind the admin
    # login, and its AccessModeInterceptor is neutralised (see JhelmRestIntegrationConfig), so
    # FULL just means "don't 403 mutating ops at jhelm's layer".
    mode: FULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    git:
      mode: full

logging:
  level:
    io.fabric8.kubernetes.client: WARN
