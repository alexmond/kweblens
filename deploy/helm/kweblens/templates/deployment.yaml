apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kweblens.fullname" . }}
  labels:
    {{- include "kweblens.labels" . | nindent 4 }}
spec:
  # A single writer holds the RWO Helm-home volume; force 1 replica + Recreate when persistent.
  replicas: {{ if .Values.persistence.enabled }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  {{- if .Values.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "kweblens.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kweblens.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kweblens.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kweblens
          image: {{ include "kweblens.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfiles | quote }}
            - name: KWEBLENS_LOAD_KUBECONFIG
              value: {{ .Values.clusterScope.local | quote }}
            - name: KWEBLENS_SECURITY_OPEN_MODE
              value: {{ .Values.auth.openMode | quote }}
            {{- if .Values.persistence.enabled }}
            - name: KWEBLENS_HELM_HOME
              value: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- range $i, $c := .Values.clusterScope.external }}
            - name: KWEBLENS_CLUSTERS_{{ $i }}_ID
              value: {{ required "each clusterScope.external entry needs an id" $c.id | quote }}
            - name: KWEBLENS_CLUSTERS_{{ $i }}_NAME
              value: {{ default $c.id $c.name | quote }}
            {{- if $c.context }}
            - name: KWEBLENS_CLUSTERS_{{ $i }}_CONTEXT
              value: {{ $c.context | quote }}
            {{- end }}
            - name: KWEBLENS_CLUSTERS_{{ $i }}_KUBECONFIG
              value: /kubeconfigs/kubeconfig
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.auth.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret }}
          {{- end }}
          {{- if or .Values.clusterScope.kubeconfigSecret .Values.persistence.enabled }}
          volumeMounts:
            {{- if .Values.clusterScope.kubeconfigSecret }}
            - name: kubeconfigs
              mountPath: /kubeconfigs
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: helm-home
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.clusterScope.kubeconfigSecret .Values.persistence.enabled }}
      volumes:
        {{- if .Values.clusterScope.kubeconfigSecret }}
        - name: kubeconfigs
          secret:
            secretName: {{ .Values.clusterScope.kubeconfigSecret }}
            items:
              - key: kubeconfig
                path: kubeconfig
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: helm-home
          persistentVolumeClaim:
            claimName: {{ include "kweblens.fullname" . }}-helm
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
