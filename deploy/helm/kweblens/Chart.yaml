apiVersion: v2
name: kweblens
description: >-
  Web-based Kubernetes IDE (Freelens reimagined as a self-hosted Spring Boot app).
  Runs standalone, as a container, or as an in-cluster pod, monitoring the hosting
  cluster (via its ServiceAccount) and/or external clusters (via mounted kubeconfigs).
type: application
# Chart version — bump on chart changes.
version: 0.2.0
# Default application version; the image tag defaults to this when image.tag is unset.
appVersion: "0.2.0"
home: https://github.com/alexmond/kweblens
sources:
  - https://github.com/alexmond/kweblens
