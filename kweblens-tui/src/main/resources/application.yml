spring:
  application:
    name: kweblens-tui
  main:
    # Belt and braces with KweblensTuiApplication's explicit WebApplicationType.NONE: a TUI
    # is never a server, and nothing about that should depend on classpath detection.
    web-application-type: none
    # The banner is 6 lines of ASCII art on the same stream as the output.
    banner-mode: off

logging:
  level:
    # A terminal app's stdout IS its output, and once a screen is drawn it is the SCREEN.
    # This value only sets the LEVEL. Where the lines GO is decided by logback.xml next to
    # this file: a file appender and no console appender at any level, so nothing logback
    # writes can land on a frame. Read logback.xml's header before changing either — the
    # two are one answer, and the GH#361 spike lost an hour to the half of it that was
    # missing. Anything that does not go through logback is caught by TerminalOutputGuard.
    root: warn

kweblens:
  tui:
    # Register a cluster per kubeconfig context. Tests set this false so the registry starts
    # empty and cannot reach a real cluster.
    load-kubeconfig: true
    # Objects per list request. Lists are always paged — see TuiProperties.
    chunk-size: 500
